# XcodeGen spec — the source of truth for the Xcode project.
# Regenerate with:  xcodegen generate   (ToothBuddy.xcodeproj is git-ignored)
# Migrated from .swiftpm on 2026-05-18 (see PLAN.md decision log). The pure logic
# still lives in the local ToothBuddyCore Swift package (run `cd ToothBuddyCore && swift test`).

name: ToothBuddy
options:
  bundleIdPrefix: com.ctlandu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ToothBuddyCore:
    path: ToothBuddyCore

targets:
  ToothBuddy:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Explicit file list (deterministic — never pulls in docs / ToothBuddyCore / .build).
    sources:
      - Shared/AppGroupBridge.swift
      - Shared/BrushingActivityAttributes.swift
      - Shared/Signposts.swift
      - BrushingIntentBridge.swift
      - BrushingLiveActivity.swift
      - BrushingStore.swift
      - BrushingZoneMonitor.swift
      - BrushGameOverlay.swift
      - BrushView.swift
      - BuddyReactiveView.swift
      - CameraPreviewView.swift
      - CameraService.swift
      - CareStore.swift
      - ContentHistoryStore.swift
      - ContentView.swift
      - DuoTheme.swift
      - DuoComponents.swift
      - DuoCharacters.swift
      - GamificationStore.swift
      - HabitCurveView.swift
      - HealthExporter.swift
      - HistoryView.swift
      - MyApp.swift
      - NotificationScheduler.swift
      - OnboardingView.swift
      - Persistence.swift
      - PreferencesStore.swift
      - RetentionStore.swift
      - ProfileStore.swift
      - SettingsView.swift
      - ReportPDFRenderer.swift
      - SoundManager.swift
      - Theme.swift
      - TipsView.swift
      - ToothBuddyIntents.swift
      - WidgetBridge.swift
      - VisionFrameProcessor.swift
      - VoiceCoach.swift
      - Support/MetricsSubscriber.swift
      - Assets.xcassets
      # Plan U5 (2026-05-28): String Catalog for app-wide UI localization.
      # Plan U7: AppShortcuts.xcstrings for Siri-phrase localization (separate
      # file per Apple docs — phrases must NOT be mixed into Localizable).
      # Both require iOS 17+ which is our deployment target since the bump.
      - Localizable.xcstrings
      - AppShortcuts.xcstrings
      - Nunito-Regular.ttf
      - Nunito-SemiBold.ttf
      - Nunito-Bold.ttf
      - Nunito-ExtraBold.ttf
      # Apple "required reason" API + tracking disclosure (App Store gate, since
      # 2024-05). Declares UserDefaults (CA92.1) + system boot time (35F9.1).
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ToothBuddyCore
        product: ToothBuddyCore
      # Embeds the widget/Live-Activity extension into the app (Spec 05 §6.4–§6.5).
      - target: ToothBuddyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctlandu.ToothBuddy
        DEVELOPMENT_TEAM: 89A8S223WV
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Quality audit 2026-05-28 / Plan U1: lock the regression door. Swift 6 mode
        # already implies SWIFT_STRICT_CONCURRENCY=complete; this flag makes any
        # remaining warning (concurrency or general) hard-fail the build, so a future
        # Xcode bump or dependency change can never silently re-introduce a warning
        # we chose not to fix. Current baseline is 0 warnings.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Support/Info.plist
        # Spec 05 — App Group so the widget can read the snapshot. Provisioned by
        # automatic signing (no manual portal step / no multi-account, unlike P2.5b).
        CODE_SIGN_ENTITLEMENTS: Support/ToothBuddy.entitlements
        # App icon ships in Assets.xcassets/AppIcon.appiconset (Plan U1, 2026-05-28):
        # 3-variant 1024×1024 PNGs (light / dark / tinted) per iOS 18 spec.
        # SVG sources live in design/.
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        # iCloud/CloudKit entitlements are intentionally NOT here yet — added in the
        # P2 CloudKit stage together with the user's interactive signing step.

  ToothBuddyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Widget/ToothBuddyWidgetBundle.swift
      - Widget/StreakWidget.swift
      - Widget/BrushingLiveActivityWidget.swift
      - Shared/AppGroupBridge.swift
      - Shared/BrushingActivityAttributes.swift
      # Duo palette shared with the main app. Colors only — Nunito TTFs are not
      # registered in the widget process; widget code uses system fonts (Duo.Fnt
      # helpers fall back to system at runtime if the family isn't found).
      - DuoTheme.swift
      # Widget-extension privacy manifest (same App Store gate; UserDefaults only).
      - path: Support/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Plan U8 (2026-05-28): widget needs its own copy of Localizable.xcstrings
      # so Live Activity / Streak widget render in the user's preferred locale.
      # Xcode's resource merger dedupes against the app's copy at install time.
      - Localizable.xcstrings
    dependencies:
      - package: ToothBuddyCore
        product: ToothBuddyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctlandu.ToothBuddy.ToothBuddyWidget
        DEVELOPMENT_TEAM: 89A8S223WV
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Quality audit 2026-05-28 / Plan U1 — same warning-as-error lock as the app target.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Support/WidgetInfo.plist
        CODE_SIGN_ENTITLEMENTS: Support/ToothBuddyWidget.entitlements
        # Widget extension shares the app's AppIcon set (system uses the
        # containing app's icon for widget gallery; no separate widget icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"

  ToothBuddyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Tests/ToothBuddyAppTests
    # ↑ Includes every *.swift under Tests/ToothBuddyAppTests automatically. As of
    # Plan U4 (2026-05-28): AppSmokeTests, BrushingStoreTests, CareStoreTests,
    # ContentHistoryStoreTests, GamificationStoreTests, GroupStoreTests,
    # HealthExporterTests, NotificationSchedulerTests, PersistenceTests,
    # ReportPDFRendererTests, WidgetBridgeTests.
    dependencies:
      - target: ToothBuddy
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # Quality audit 2026-05-28 / Plan U1 — same warning-as-error lock for tests.
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"

schemes:
  ToothBuddy:
    build:
      targets:
        ToothBuddy: all
        ToothBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ToothBuddyTests
