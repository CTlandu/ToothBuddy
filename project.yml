# XcodeGen spec — the source of truth for the Xcode project.
# Regenerate with:  xcodegen generate   (ToothBuddy.xcodeproj is git-ignored)
# Migrated from .swiftpm on 2026-05-18 (see PLAN.md decision log). The pure logic
# still lives in the local ToothBuddyCore Swift package (run `cd ToothBuddyCore && swift test`).

name: ToothBuddy
options:
  bundleIdPrefix: com.ctlandu
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  ToothBuddyCore:
    path: ToothBuddyCore

targets:
  ToothBuddy:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    # Explicit file list (deterministic — never pulls in docs / ToothBuddyCore / .build).
    sources:
      - Shared/AppGroupBridge.swift
      - Shared/BrushingActivityAttributes.swift
      - BrushingIntentBridge.swift
      - BrushingLiveActivity.swift
      - BrushingStore.swift
      - BrushingZoneMonitor.swift
      - BrushGameOverlay.swift
      - BrushView.swift
      - CameraPreviewView.swift
      - CameraService.swift
      - CareStore.swift
      - ContentHistoryStore.swift
      - ContentView.swift
      - DuoTheme.swift
      - DuoComponents.swift
      - DuoCharacters.swift
      - FloatingToothBubblesView.swift
      - GamificationStore.swift
      - GroupStore.swift
      - GroupDashboardView.swift
      - HabitCurveView.swift
      - HealthExporter.swift
      - HistoryView.swift
      - MyApp.swift
      - NotificationScheduler.swift
      - OnboardingView.swift
      - Persistence.swift
      - ProfileStore.swift
      - ProfilePickerView.swift
      - ReportPDFRenderer.swift
      - SoundManager.swift
      - Theme.swift
      - TipsView.swift
      - ToothBuddyIntents.swift
      - WidgetBridge.swift
      - VisionFrameProcessor.swift
      - VoiceCoach.swift
      - Assets.xcassets
      - Nunito-Regular.ttf
      - Nunito-SemiBold.ttf
      - Nunito-Bold.ttf
      - Nunito-ExtraBold.ttf
      # Apple "required reason" API + tracking disclosure (App Store gate, since
      # 2024-05). Declares UserDefaults (CA92.1) + system boot time (35F9.1).
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ToothBuddyCore
        product: ToothBuddyCore
      # Embeds the widget/Live-Activity extension into the app (Spec 05 §6.4–§6.5).
      - target: ToothBuddyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctlandu.ToothBuddy
        DEVELOPMENT_TEAM: 89A8S223WV
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Support/Info.plist
        # Spec 05 — App Group so the widget can read the snapshot. Provisioned by
        # automatic signing (no manual portal step / no multi-account, unlike P2.5b).
        CODE_SIGN_ENTITLEMENTS: Support/ToothBuddy.entitlements
        # No app icon designed yet (the .swiftpm used a placeholder). Empty name
        # disables the AppIcon requirement; set this to "AppIcon" once one exists.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # iCloud/CloudKit entitlements are intentionally NOT here yet — added in the
        # P2 CloudKit stage together with the user's interactive signing step.

  ToothBuddyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Widget/ToothBuddyWidgetBundle.swift
      - Widget/StreakWidget.swift
      - Widget/BrushingLiveActivityWidget.swift
      - Shared/AppGroupBridge.swift
      - Shared/BrushingActivityAttributes.swift
      # Duo palette shared with the main app. Colors only — Nunito TTFs are not
      # registered in the widget process; widget code uses system fonts (Duo.Fnt
      # helpers fall back to system at runtime if the family isn't found).
      - DuoTheme.swift
      # Widget-extension privacy manifest (same App Store gate; UserDefaults only).
      - path: Support/Widget/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: ToothBuddyCore
        product: ToothBuddyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ctlandu.ToothBuddy.ToothBuddyWidget
        DEVELOPMENT_TEAM: 89A8S223WV
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Support/WidgetInfo.plist
        CODE_SIGN_ENTITLEMENTS: Support/ToothBuddyWidget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""

  ToothBuddyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - Tests/ToothBuddyAppTests
    dependencies:
      - target: ToothBuddy
    settings:
      base:
        SWIFT_VERSION: "6.0"

schemes:
  ToothBuddy:
    build:
      targets:
        ToothBuddy: all
        ToothBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ToothBuddyTests
