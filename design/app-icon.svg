<?xml version="1.0" encoding="UTF-8"?>
<!--
  ToothBuddy App Icon — Light variant
  Plan U1 (docs/plans/2026-05-28-002-feat-app-store-launch-plan.md)

  Design: simplified friendly tooth silhouette on Duo.green background,
  with chunky ink outline + offset darker-green shadow (Duolingo signature).
  No rounded corners on the background rect — iOS masks the icon to its
  platform-appropriate squircle automatically.

  Colors:
    Duo.green        #58CC02
    Duo.greenShadow  #3F8F00 (Duolingo button-press shadow tone)
    Ink              #2B2535
    White            #FFFFFF
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Background: full bleed, Duo.green. iOS masks to platform squircle. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#58CC02"/>

  <!--
    Symmetric tooth shape. Origin (512, 540).
    Crown wide: x = 220..804 at top. Bottom roots split around x = 512.
    All control points mirrored across x = 512 so the shape is exactly symmetric.
  -->

  <!-- Ink offset shadow (32px down-right) — visible because it's wider than the white -->
  <path d="
    M 512 200
    C 660 200, 768 240, 768 360
    C 768 460, 720 560, 680 640
    C 660 690, 640 760, 600 810
    C 580 836, 528 836, 524 776
    L 524 720
    L 500 720
    L 500 776
    C 496 836, 444 836, 424 810
    C 384 760, 364 690, 344 640
    C 304 560, 256 460, 256 360
    C 256 240, 364 200, 512 200
    Z"
    transform="translate(32, 32)"
    fill="#2B2535"
    stroke="#2B2535"
    stroke-width="40"
    stroke-linejoin="round"/>

  <!-- White tooth body, same path -->
  <path d="
    M 512 200
    C 660 200, 768 240, 768 360
    C 768 460, 720 560, 680 640
    C 660 690, 640 760, 600 810
    C 580 836, 528 836, 524 776
    L 524 720
    L 500 720
    L 500 776
    C 496 836, 444 836, 424 810
    C 384 760, 364 690, 344 640
    C 304 560, 256 460, 256 360
    C 256 240, 364 200, 512 200
    Z"
    fill="#FFFFFF"
    stroke="#2B2535"
    stroke-width="40"
    stroke-linejoin="round"/>

</svg>
