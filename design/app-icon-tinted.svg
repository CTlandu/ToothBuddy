<?xml version="1.0" encoding="UTF-8"?>
<!--
  ToothBuddy App Icon — Tinted variant
  Plan U1. Same silhouette as Light; rendered as light-gray-on-dark with
  no internal color details (iOS applies the user's tint to the glyph area).
  Per Apple HIG: tinted icon should be a single light glyph on a dark BG.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Dark BG -->
  <rect x="0" y="0" width="1024" height="1024" fill="#1A1525"/>

  <!-- Brush as a single light-gray silhouette -->
  <g transform="rotate(-26 512 512)" fill="#E8E8E8">
    <rect x="0" y="540" width="720" height="110" rx="55"/>
    <rect x="700" y="500" width="220" height="190" rx="80"/>
    <circle cx="868" cy="438" r="54"/>
    <circle cx="918" cy="405" r="30"/>
  </g>

  <!-- Tooth — light gray silhouette, no face details (system will tint) -->
  <path d="M 512 200 C 660 200, 768 240, 768 360 C 768 460, 720 560, 680 640 C 660 690, 640 760, 600 810 C 580 836, 528 836, 524 776 L 524 720 L 500 720 L 500 776 C 496 836, 444 836, 424 810 C 384 760, 364 690, 344 640 C 304 560, 256 460, 256 360 C 256 240, 364 200, 512 200 Z"
    fill="#F2F2F2"/>

  <!-- Cap silhouette (subtle separation from tooth via slight tone diff) -->
  <ellipse cx="412" cy="245" rx="190" ry="36" fill="#D4D4D4"/>
  <path d="M 282 252 Q 282 70, 512 70 Q 742 70, 742 252 Z" fill="#D4D4D4"/>

</svg>
