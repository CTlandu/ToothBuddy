<?xml version="1.0" encoding="UTF-8"?>
<!--
  ToothBuddy App Icon — Dark variant
  Plan U1. Same shape; ink-near-black BG; Duo.green tooth (inversion of Light).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">

  <!-- Background: ink-near-black -->
  <rect x="0" y="0" width="1024" height="1024" fill="#1A1525"/>

  <!-- Ink offset shadow (32px down-right) — darker than BG for subtle depth -->
  <path d="
    M 512 200
    C 660 200, 768 240, 768 360
    C 768 460, 720 560, 680 640
    C 660 690, 640 760, 600 810
    C 580 836, 528 836, 524 776
    L 524 720
    L 500 720
    L 500 776
    C 496 836, 444 836, 424 810
    C 384 760, 364 690, 344 640
    C 304 560, 256 460, 256 360
    C 256 240, 364 200, 512 200
    Z"
    transform="translate(32, 32)"
    fill="#000000"
    opacity="0.5"
    stroke="#000000"
    stroke-width="40"
    stroke-linejoin="round"/>

  <!-- Tooth body: white in Dark mode (keeps high contrast) -->
  <path d="
    M 512 200
    C 660 200, 768 240, 768 360
    C 768 460, 720 560, 680 640
    C 660 690, 640 760, 600 810
    C 580 836, 528 836, 524 776
    L 524 720
    L 500 720
    L 500 776
    C 496 836, 444 836, 424 810
    C 384 760, 364 690, 344 640
    C 304 560, 256 460, 256 360
    C 256 240, 364 200, 512 200
    Z"
    fill="#FFFFFF"
    stroke="#58CC02"
    stroke-width="40"
    stroke-linejoin="round"/>

</svg>
